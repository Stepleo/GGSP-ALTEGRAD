name: Deploy to SSPCloud

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Log in to Docker
    - name: Log in to Docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Step 3: Build and push Docker image
    - name: Build and push Docker image
      run: |
        docker build -t leostep/fastapi-mlflow:${{ github.ref_name }} .
        docker tag leostep/fastapi-mlflow:${{ github.ref_name }} leostep/fastapi-mlflow:latest
        docker push leostep/fastapi-mlflow:${{ github.ref_name }}
        docker push leostep/fastapi-mlflow:latest

    # Step 4: Configure kubectl
    - name: Set up kubectl
      run: |
        kubectl config set-cluster apiserver.kub.sspcloud.fr \
          --server=${{ secrets.K8S_SERVER }} \
          --insecure-skip-tls-verify=true

        kubectl config set-credentials lstepien \
          --auth-provider=oidc \
          --auth-provider-arg=idp-issuer-url=https://auth.lab.sspcloud.fr/auth/realms/sspcloud \
          --auth-provider-arg=client-id=onyxia \
          --auth-provider-arg=refresh-token=${{ secrets.K8S_REFRESH_TOKEN }} \
          --auth-provider-arg=id-token=${{ secrets.K8S_ID_TOKEN }}

        kubectl config set-context apiserver.kub.sspcloud.fr \
          --user=lstepien \
          --cluster=apiserver.kub.sspcloud.fr \
          --namespace=${{ secrets.K8S_NAMESPACE }}

        kubectl config use-context apiserver.kub.sspcloud.fr

    # Step 5: Create or update Kubernetes secrets
    - name: Create or update Kubernetes secrets
      run: |
        kubectl create secret generic mlflow-credentials \
          --from-literal=MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }} \
          --from-literal=MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }} \
          --dry-run=client -o yaml | kubectl apply -f -

    # Step 6: Deploy to Kubernetes
    - name: Deploy to SSPCloud
      run: |
        kubectl delete deployment,service,ingress -l app=ngg --ignore-not-found
        kubectl apply -f deployment/
        kubectl rollout status deployment/ngg-deployment